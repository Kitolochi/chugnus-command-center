<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0c0c0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>
  <!-- Glow effect -->
  <circle cx="128" cy="118" r="70" fill="url(#glow)"/>
  <!-- M letterform made of geometric bars -->
  <!-- Left vertical -->
  <rect x="56" y="68" width="18" height="120" rx="9" fill="url(#accent)"/>
  <!-- Left diagonal -->
  <rect x="74" y="68" width="18" height="80" rx="4" fill="url(#accent)" transform="rotate(22 83 68)"/>
  <!-- Center point -->
  <circle cx="128" cy="132" r="10" fill="#8b5cf6"/>
  <!-- Right diagonal -->
  <rect x="164" y="68" width="18" height="80" rx="4" fill="url(#accent)" transform="rotate(-22 173 68)"/>
  <!-- Right vertical -->
  <rect x="182" y="68" width="18" height="120" rx="9" fill="url(#accent)"/>
  <!-- Dot accent below - like an agenda bullet -->
  <circle cx="96" cy="208" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="128" cy="208" r="5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="160" cy="208" r="5" fill="#06b6d4" opacity="0.8"/>
</svg>
