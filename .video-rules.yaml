# .video-rules.yaml — Chugnus Command Center Hype Showcase
# Generated by /video-create pipeline
# CONCEPT: Single isometric UI card, continuous camera orbit, problem-solution text overlays.
# No cuts. No bar transitions. Camera choreography IS the editing.

version: "2.0.0"

# ─── IDENTITY ───────────────────────────────────────────
metadata:
  title: "Chugnus Command Center — Hype Product Showcase"
  video_type: "hype-launch"
  school: "product_showcase"
  concept: "single_shot_isometric_orbit"
  concept_description: >
    One isometric 3D card showing the full Chugnus UI floats in a dark void.
    The camera traces a choreographed path around it in three acts:
    slow orbit (problem), dynamic zooms (solution), slow pullback (brand).
    Text overlays in screen-space deliver problem-solution messaging.
    No cuts, no wipes, no bar transitions. The camera move IS the edit.
  structural_patterns: ["I_single_continuous_example", "E_cinematic_problem_arc"]
  production_mode: "hero"
  production_philosophy: "craft"
  created_at: "2026-03-19"
  duration_seconds: 30
  fps: 60
  total_frames: 1800

# ─── AUDIENCE ────────────────────────────────────────────
audience:
  primary: "Developers and AI power users running Claude Code sessions"
  secondary: "Technical leads, indie hackers, AI automation enthusiasts"
  demographic: "25-45, technical, familiar with terminals and agent workflows"
  platform_primary: "youtube"
  platform_secondary: ["twitter", "linkedin"]
  aspect_ratio: "16:9"
  resolution: "1920x1080"

# ─── AESTHETIC ───────────────────────────────────────────
aesthetic:
  temperature: "cool"
  mood: "confident, tech-premium, controlled power"
  energy_cap: 1.0
  vibe: "A single floating command center card in void — the camera reveals what it can do"

  movement:
    primary: "superseed_standard"
    primary_tier: "default"
    secondary: "code_brutalism"
    secondary_tier: "precision"

  typography:
    hero_font: "JetBrains Mono"
    hero_weight: 700
    hero_size_px: 84
    hero_style: "solid_color"
    hero_letter_spacing: "0.05em"

    accent_font: "Space Grotesk"
    accent_size_px: 32

    body_font: "DM Sans"
    body_size_px: 16

    display_font: "Instrument Sans"
    display_note: "Logo/brand name only"

    text_overlay_rules:
      placement: "screen_space"
      placement_note: "Text faces camera, not attached to card"
      problem_text_color: "rgba(255,255,255,0.70)"
      problem_text_size_px: 36
      solution_text_color: "#6C8EEF"
      solution_text_size_px: 42
      brand_text_color: "rgba(255,255,255,0.95)"
      brand_text_size_px: 72
      entrance: "fade_in"
      entrance_duration_ms: 400
      exit: "fade_out"
      exit_duration_ms: 300
      font: "JetBrains Mono"

  colors:
    background: "#0c0c0e"
    surface_1: "#131316"
    surface_2: "#1a1a1f"
    surface_3: "#222228"
    surface_4: "#2a2a32"
    text_primary: "rgba(255,255,255,0.95)"
    text_secondary: "#6b6b7b"
    accent_blue: "#6C8EEF"
    accent_purple: "#A78BFA"
    accent_emerald: "#34D399"
    accent_amber: "#FBBF24"
    accent_rose: "#F472B6"
    accent_red: "#F87171"
    accent_teal: "#2DD4BF"
    accent_orange: "#FB923C"
    light_mode_bg: "#F5F0EB"
    light_mode_text: "#1a1a1f"

# ─── THE CARD ────────────────────────────────────────────
card:
  description: >
    A 3D isometric card showing the Chugnus Command Center UI.
    The card has physical depth (glass slab with thickness), not a flat plane.
    Each tab's UI is rendered on the card surface. The camera zooms into
    different regions to reveal different tabs/features.
  material:
    surface: "glassmorphic"
    thickness_px: 24
    edge_glow_color: "#6C8EEF"
    edge_glow_opacity: 0.15
    corner_radius_px: 16
    reflection: true
    reflection_opacity: 0.06
    reflection_note: "Subtle bottom-face reflection on void floor"
  dimensions:
    width: 1200
    height: 800
    depth: 24
    note: "Card proportions match 16:10 app window"
  initial_angle:
    rotateX: -25
    rotateY: 35
    rotateZ: 0
    note: "Classic isometric hero angle — top-left face visible"

  ui_regions:
    - name: "sidebar"
      position: "left 0-15%"
      content: "Tab navigation with group headers (Command, AI & Knowledge, Settings)"
    - name: "command_center"
      position: "center-right 15-100%, tab 1"
      content: "Task queue with status pills (green=working, amber=awaiting, red=errored)"
    - name: "agents"
      position: "center-right 15-100%, tab 2"
      content: "Agent cards with pulsing status dots, stats dashboard (runs, success rate, spend)"
    - name: "sessions"
      position: "center-right 15-100%, tab 3"
      content: "CSS-grid activity heatmap, horizontal bar charts for tool usage"
    - name: "memories"
      position: "center-right 15-100%, tab 4"
      content: "Memory cards with importance dots, color-coded topic tags"
    - name: "context_query"
      position: "center-right 15-100%, tab 5"
      content: "Smart query interface — search bar, RAG response with source citations"
    - name: "kanban"
      position: "center-right 15-100%, tab 2 sub-view"
      content: "Kanban board (Backlog > Todo > In Progress > Review > Done) with drag-drop"

# ─── CAMERA PATH ─────────────────────────────────────────
# The camera traces one continuous path. Waypoints define key moments.
# Interpolation between waypoints should use smooth easing (no hard jumps).
#
# act: "problem" | "solution" | "brand"
# camera_action: what the camera physically does
# text: overlay text shown during this waypoint (null = no text)
# text_type: "problem" | "solution" | "brand" (drives color/size from typography rules)
# energy: 0-1 scale driving particle speed, DOF intensity, ambient motion

camera_path:
  interpolation: "cubicBezier(0.25, 0.1, 0.25, 1.0)"
  interpolation_note: "Smooth productive easing between waypoints. Solution zooms use expressive easing."

  waypoints:
    # ── ACT 1: THE PROBLEM (0-10s) ── Slow orbit, tension building ──
    - id: "W1"
      time: "0-2s"
      frames: [0, 120]
      act: "problem"
      camera_action: "Wide establishing shot. Card fades in from black. Camera at 30deg isometric, slowly orbiting right."
      camera:
        distance: 2400
        orbit_speed_deg_per_s: 4
        rotateX: -25
        rotateY: 35
      target_region: null
      text: null
      energy: 0.40

    - id: "W2"
      time: "2-4s"
      frames: [120, 240]
      act: "problem"
      camera_action: "Continue orbit, subtle push-in. Card becoming legible."
      camera:
        distance: 2100
        orbit_speed_deg_per_s: 4
        rotateX: -25
        rotateY: 43
      target_region: null
      text: "You run 12 Claude sessions a day."
      text_type: "problem"
      energy: 0.45

    - id: "W3"
      time: "4-6s"
      frames: [240, 360]
      act: "problem"
      camera_action: "Orbit continues, camera drifts slightly downward. Showing card at angle."
      camera:
        distance: 1900
        orbit_speed_deg_per_s: 3
        rotateX: -20
        rotateY: 51
      target_region: null
      text: "None of them talk to each other."
      text_type: "problem"
      energy: 0.50

    - id: "W4"
      time: "6-8s"
      frames: [360, 480]
      act: "problem"
      camera_action: "Slow tilt, approaching card edge. Sidebar nav becoming visible."
      camera:
        distance: 1600
        orbit_speed_deg_per_s: 2
        rotateX: -18
        rotateY: 57
      target_region: "sidebar"
      text: "Your agents forget. Your sessions vanish."
      text_type: "problem"
      energy: 0.60

    - id: "W5"
      time: "8-10s"
      frames: [480, 600]
      act: "problem"
      camera_action: "Pause orbit. Slight drift. Card center visible. Tension peak before the break."
      camera:
        distance: 1400
        orbit_speed_deg_per_s: 1
        rotateX: -15
        rotateY: 60
      target_region: null
      text: "Your knowledge scatters across 47 files."
      text_type: "problem"
      energy: 0.65

    # ── ACT 2: THE SOLUTION (10-22s) ── Dynamic zooms, capability reveals ──
    - id: "W6"
      time: "10-11.5s"
      frames: [600, 690]
      act: "solution"
      camera_action: "ZOOM PUNCH into Command Center tab. Rack focus sharpens queue. First energy spike."
      camera:
        distance: 600
        orbit_speed_deg_per_s: 0
        rotateX: -5
        rotateY: 62
        zoom_easing: "cubicBezier(0.34, 1.56, 0.64, 1.0)"
      target_region: "command_center"
      text: "Command Center."
      text_type: "solution"
      energy: 0.85

    - id: "W7"
      time: "11.5-13s"
      frames: [690, 780]
      act: "solution"
      camera_action: "Quick spin 45deg, zoom into Agents tab. Agent status dots pulse."
      camera:
        distance: 650
        orbit_speed_deg_per_s: 30
        rotateX: -8
        rotateY: 107
        zoom_easing: "cubicBezier(0.34, 1.56, 0.64, 1.0)"
      target_region: "agents"
      text: "Deploy agents. Track runs. Watch them work."
      text_type: "solution"
      energy: 0.90

    - id: "W8"
      time: "13-14.5s"
      frames: [780, 870]
      act: "solution"
      camera_action: "Tilt up, zoom into Sessions tab. Heatmap cells fill with color."
      camera:
        distance: 600
        orbit_speed_deg_per_s: 15
        rotateX: -3
        rotateY: 122
        zoom_easing: "cubicBezier(0.34, 1.56, 0.64, 1.0)"
      target_region: "sessions"
      text: "See where your time goes."
      text_type: "solution"
      energy: 0.95

    - id: "W9"
      time: "14.5-16s"
      frames: [870, 960]
      act: "solution"
      camera_action: "Quick orbit 90deg, zoom into Memories tab. Cards stagger in."
      camera:
        distance: 650
        orbit_speed_deg_per_s: 60
        rotateX: -10
        rotateY: 212
        zoom_easing: "cubicBezier(0.34, 1.56, 0.64, 1.0)"
      target_region: "memories"
      text: "Extract knowledge. Keep it."
      text_type: "solution"
      energy: 0.90

    - id: "W10"
      time: "16-17.5s"
      frames: [960, 1050]
      act: "solution"
      camera_action: "Snap focus to Context tab. Query typed, RAG response streams in."
      camera:
        distance: 580
        orbit_speed_deg_per_s: 20
        rotateX: -5
        rotateY: 232
        zoom_easing: "cubicBezier(0.34, 1.56, 0.64, 1.0)"
      target_region: "context_query"
      text: "Ask your own data anything."
      text_type: "solution"
      energy: 0.95

    - id: "W11"
      time: "17.5-19s"
      frames: [1050, 1140]
      act: "solution"
      camera_action: "Quick spin, zoom into Kanban sub-view. Card drags across columns."
      camera:
        distance: 620
        orbit_speed_deg_per_s: 40
        rotateX: -8
        rotateY: 272
        zoom_easing: "cubicBezier(0.34, 1.56, 0.64, 1.0)"
      target_region: "kanban"
      text: "Ship faster."
      text_type: "solution"
      energy: 1.00

    - id: "W12"
      time: "19-22s"
      frames: [1140, 1320]
      act: "solution"
      camera_action: "Fast orbit showing all faces. Card spins freely. Pure spectacle — blur of motion and UI."
      camera:
        distance: 900
        orbit_speed_deg_per_s: 120
        rotateX: -20
        rotateY: "full_rotation"
        zoom_easing: "cubicBezier(0.25, 0.1, 0.25, 1.0)"
      target_region: null
      text: null
      text_note: "No text during spin — pure visual spectacle. The speed communicates 'all of this.'"
      energy: 1.00

    # ── ACT 3: THE BRAND (22-30s) ── Slow pullback, anchor ──
    - id: "W13"
      time: "22-25s"
      frames: [1320, 1500]
      act: "brand"
      camera_action: "Decelerate. Pull back to wide. Card settling into hero angle with gentle rotation."
      camera:
        distance: 2000
        orbit_speed_deg_per_s: 3
        rotateX: -25
        rotateY: 35
        zoom_easing: "cubicBezier(0.25, 0.1, 0.25, 1.0)"
      target_region: null
      text: "Chugnus Command Center"
      text_type: "brand"
      energy: 0.60

    - id: "W14"
      time: "25-28s"
      frames: [1500, 1680]
      act: "brand"
      camera_action: "Slow drift. Card subtle float animation. Almost still."
      camera:
        distance: 2200
        orbit_speed_deg_per_s: 1
        rotateX: -25
        rotateY: 38
      target_region: null
      text: "Your AI Command Center."
      text_type: "brand"
      energy: 0.45

    - id: "W15"
      time: "28-30s"
      frames: [1680, 1800]
      act: "brand"
      camera_action: "Hold. Subtle float. Final hero frame — clean and readable."
      camera:
        distance: 2200
        orbit_speed_deg_per_s: 0.5
        rotateX: -25
        rotateY: 39
      target_region: null
      text: "Logo + github.com/Kitolochi/chugnus-command-center"
      text_type: "brand"
      text_note: "Glow pulse on logo. All motion settles 500ms before end."
      energy: 0.35

# ─── MESSAGING SCRIPT ────────────────────────────────────
messaging:
  arc: "problem_solution"
  problem_statements:
    - text: "You run 12 Claude sessions a day."
      waypoint: "W2"
      note: "Establishes scale — viewer recognizes their own behavior"
    - text: "None of them talk to each other."
      waypoint: "W3"
      note: "Names the core pain — isolation between sessions"
    - text: "Your agents forget. Your sessions vanish."
      waypoint: "W4"
      note: "Escalates — not just inconvenient, you're losing work"
    - text: "Your knowledge scatters across 47 files."
      waypoint: "W5"
      note: "Specific number makes it visceral. Tension peak."
  solution_statements:
    - text: "Command Center."
      waypoint: "W6"
      note: "Two words. The answer. Camera zoom does the explaining."
    - text: "Deploy agents. Track runs. Watch them work."
      waypoint: "W7"
      note: "Three verbs — agency, visibility, control"
    - text: "See where your time goes."
      waypoint: "W8"
      note: "Analytics framed as self-knowledge, not metrics"
    - text: "Extract knowledge. Keep it."
      waypoint: "W9"
      note: "Two sentences. Extract = active. Keep = permanent."
    - text: "Ask your own data anything."
      waypoint: "W10"
      note: "The RAG promise in plain language"
    - text: "Ship faster."
      waypoint: "W11"
      note: "Shortest line at peak energy. Maximum impact."
  brand_statements:
    - text: "Chugnus Command Center"
      waypoint: "W13"
      note: "Product name as the full card returns to view"
    - text: "Your AI Command Center."
      waypoint: "W14"
      note: "Tagline positions the category"

# ─── RENDERING STACK ─────────────────────────────────────
# Adapted for single continuous shot — no wipes, no cut flashes
rendering_stack:
  parallax_background:
    enabled: true
    orb_count: 3
    orb_colors: ["#6C8EEF", "#A78BFA", "rgba(255,255,255,0.15)"]
    orb_blur_px: [100, 80, 120]
    dot_grid: true
    dot_grid_opacity: 0.06
    gradient: "radial-gradient(ellipse 120% 100% at 50% 40%, rgba(108,142,239,0.04) 0%, transparent 60%)"
    orb_motion: "slow_drift"
    orb_note: "Orbs drift independently of camera — they're in world-space, not camera-space"

  depth_of_field:
    enabled: true
    description: "Rack focus follows camera target region. Close UI sharp, distant UI softens."
    blur_near: 0
    blur_far: 8
    focal_distance: "matches camera target_region center"
    transition_ms: 400

  card_material:
    surface: "glassmorphic"
    thickness_px: 24
    edge_glow_color: "#6C8EEF"
    edge_glow_opacity: 0.15
    corner_radius_px: 16
    reflection_enabled: true
    reflection_opacity: 0.06

  particles:
    count: 40
    style: "hexagons"
    colors: ["#6C8EEF", "#A78BFA", "rgba(255,255,255,0.3)"]
    orbit_card: true
    orbit_note: "Particles orbit the card in 3D space, speed synced to camera movement"
    speed_sync:
      act_problem: 0.5
      act_solution: 2.5
      act_brand: 0.3
    burst_on_zoom_punch: true
    burst_count: 30

  film_grain:
    enabled: true
    opacity: 0.03
    tint: "neutral"

  scanlines:
    enabled: true
    opacity: 0.03
    spacing_px: 2

  vignette:
    enabled: true
    color: "rgba(0,0,0,0.4)"
    radius: "50%"

  progress_bar:
    enabled: true
    color: "#6C8EEF"
    height_px: 3

  # These layers are DISABLED for single-shot concept:
  geometric_wipes:
    enabled: false
    note: "No cuts to wipe between"
  flash:
    enabled: false
    note: "No transitions to flash on. Particle bursts on zoom punches replace flashes."
  light_leak:
    enabled: true
    style: "diagonal_pulse"
    opacity: 0.04
    color: "#6C8EEF"
    cycle_seconds: 6
  chroma_flash:
    enabled: false
    note: "Chromatic aberration would fight the rack focus system"

# ─── UI ANIMATIONS ON CARD ───────────────────────────────
# When the camera zooms into a region, the UI in that region comes alive.
# These are micro-animations on the card surface, not camera moves.
ui_animations:
  command_center:
    trigger: "W6"
    animations:
      - element: "status_pills"
        action: "pulse green/amber/red in sequence"
        duration_ms: 1500
      - element: "queue_cards"
        action: "subtle slide-up stagger, 3 cards"
        stagger_ms: 80
  agents:
    trigger: "W7"
    animations:
      - element: "status_dots"
        action: "pulse (idle=blue, running=emerald, paused=amber)"
        duration_ms: 1000
      - element: "stats_counters"
        action: "count up (0→47 runs, 0→94%, $0→$12.40)"
        duration_ms: 1200
  sessions:
    trigger: "W8"
    animations:
      - element: "heatmap_cells"
        action: "sweep fill from left to right, cells colorize"
        duration_ms: 1000
      - element: "bar_charts"
        action: "bars grow from zero to final width"
        duration_ms: 800
  memories:
    trigger: "W9"
    animations:
      - element: "memory_cards"
        action: "stagger fade-in, 4 cards with topic color tags"
        stagger_ms: 60
      - element: "importance_dots"
        action: "pop in after card entrance"
        delay_ms: 300
  context_query:
    trigger: "W10"
    animations:
      - element: "search_bar"
        action: "live typing: 'How do my agents handle errors?'"
        typing_speed_ms: 40
      - element: "response"
        action: "stream in, line by line with source citations"
        delay_ms: 600
        stream_speed_ms: 30
  kanban:
    trigger: "W11"
    animations:
      - element: "kanban_card"
        action: "drag from 'In Progress' column to 'Review' column"
        duration_ms: 800
      - element: "column_count"
        action: "badge count updates (3→2 and 1→2)"
        delay_ms: 400

# ─── TECHNIQUES ──────────────────────────────────────────
techniques:
  use:
    - name: "isometric_3d_card"
      reason: "Single hero object — the entire video orbits one card"
    - name: "rack_focus_depth_of_field"
      reason: "Guides attention to zoom target, softens non-focal regions"
    - name: "zoom_punch"
      reason: "Dynamic zooms into UI regions create energy spikes in Act 2"
    - name: "particle_orbit"
      reason: "Hexagon particles orbiting the card add ambient life"
    - name: "live_typing"
      reason: "Smart query typing animation proves the RAG feature works"
    - name: "data_bloom"
      reason: "Counter spin-up on agent stats creates 'impressive scale' response"
    - name: "continuous_camera"
      reason: "Single unbroken take communicates confidence and polish"
  prohibit:
    - name: "geometric_wipes"
      reason: "No cuts exist in a single-shot video"
      source: "concept"
    - name: "flash_transitions"
      reason: "No bar transitions to flash on"
      source: "concept"
    - name: "serif_fonts"
      reason: "Code Brutalism secondary — monospace and geometric sans only"
      source: "aesthetic_movement"
    - name: "organic_blob_shapes"
      reason: "Code Brutalism — geometric shapes only"
      source: "aesthetic_movement"
    - name: "easeOutBounce"
      reason: "Undermines precision of developer tool"
      source: "video_type"
    - name: "warm_color_dominance"
      reason: "Cool palette (blue/purple) is the brand"
      source: "aesthetic_movement"
    - name: "multiple_cards_or_scenes"
      reason: "Concept is ONE card. Adding extra objects breaks the single-object focus."
      source: "concept"

# ─── AUDIO ───────────────────────────────────────────────
audio:
  track: "TBD"
  bpm: 128
  duration_seconds: 30
  genre: ["future bass", "tech electronic", "cinematic electronic"]
  instruments: ["synth pads", "sub bass", "hi-hats", "snare", "atmospheric strings"]
  emotional_temperature: "builds from contemplative to confident to powerful to resolved"
  energy_profile:
    - act: "problem"
      time: "0-10s"
      energy_range: [0.40, 0.65]
      description: "Atmospheric pads, slow build, subtle tension. Low percussion."
    - act: "solution"
      time: "10-22s"
      energy_range: [0.85, 1.00]
      description: "Drops hit. Bass kicks. Hi-hats open. Each zoom punch syncs to a beat hit."
    - act: "brand"
      time: "22-30s"
      energy_range: [0.35, 0.60]
      description: "Energy resolves. Pads return. Clean decay. Final note rings out."
  audio_status: "spec_only"
  critical_sync_points:
    - time: "10.0s"
      type: "first_drop"
      description: "Act 1→2 transition. First zoom punch into Command Center syncs to bass drop."
    - time: "17.5s"
      type: "peak_hit"
      description: "'Ship faster.' — shortest text at highest energy. Snare hit."
    - time: "19.0s"
      type: "spectacle_start"
      description: "Full spin begins. Bass and percussion peak."
    - time: "22.0s"
      type: "resolve"
      description: "Spin decelerates. Music pulls back. Atmospheric transition."

# ─── SFX PLAN ───────────────────────────────────────────
sfx_plan:
  total_events: 18
  budget_note: "Lighter SFX budget for single-shot — camera whooshes and UI micro-sounds"
  events:
    - waypoint: "W1"
      time: "0.0s"
      sfx: ["ambient-drone-start"]
      volume: 0.15
      note: "Low atmospheric drone as card fades in"
    - waypoint: "W6"
      time: "10.0s"
      sfx: ["zoom-whoosh", "ui-chime"]
      volume: [0.18, 0.12]
      note: "First zoom punch — the energy shift"
    - waypoint: "W7"
      time: "11.5s"
      sfx: ["spin-whoosh", "status-pulse"]
      volume: [0.15, 0.10]
      note: "Camera spin + agent dots pulse"
    - waypoint: "W8"
      time: "13.0s"
      sfx: ["zoom-whoosh", "data-tick"]
      volume: [0.14, 0.12]
      note: "Heatmap fill sweep"
    - waypoint: "W9"
      time: "14.5s"
      sfx: ["orbit-whoosh", "card-entrance"]
      volume: [0.16, 0.10]
      note: "Quick orbit + memory cards appear"
    - waypoint: "W10"
      time: "16.0s"
      sfx: ["snap-focus", "typing-keys"]
      volume: [0.12, 0.08]
      note: "Rack focus snap + live typing"
    - waypoint: "W11"
      time: "17.5s"
      sfx: ["zoom-whoosh", "drag-drop"]
      volume: [0.18, 0.12]
      note: "Peak energy zoom + kanban card drag"
    - waypoint: "W12"
      time: "19.0s"
